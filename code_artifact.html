<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢甲美食命運轉盤 - 決定今晚吃什麼！</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for winning/McDonalds celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #1a0b2e 100%);
            min-height: 100vh;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.7), 0 0 20px rgba(236, 72, 153, 0.5), 0 0 30px rgba(168, 85, 247, 0.4);
        }
        .card-glass {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-between min-h-screen p-4 sm:p-6 overflow-x-hidden">

    <header class="text-center my-4 z-10">
        <div class="inline-block px-4 py-1 mb-2 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-300 text-xs font-bold tracking-wider uppercase animate-pulse">
            🔥 逢甲夜市美食終極救贖
        </div>
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight neon-glow text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-amber-300">
            逢甲美食命運轉盤
        </h1>
        <p class="text-gray-300 text-sm sm:text-base mt-2 max-w-md mx-auto">
            選擇困難症救星！連續不滿意 3 次，命運將強制帶你去<span class="text-yellow-400 font-bold">麥當勞</span>！
        </p>
    </header>

    <main class="w-full max-w-lg flex flex-col items-center my-auto z-10">
        
        <!-- Counter and Status Banner -->
        <div class="w-full flex justify-between items-center mb-4 px-4 py-3 card-glass rounded-2xl shadow-lg">
            <div class="flex items-center space-x-2">
                <span class="text-xl">💔</span>
                <span class="text-sm sm:text-base font-semibold text-gray-200">不滿意次數：</span>
            </div>
            <div class="flex items-center space-x-1">
                <span id="strike-count" class="text-2xl font-black text-pink-400">0</span>
                <span class="text-gray-400 text-sm">/ 3 次</span>
            </div>
        </div>

        <!-- Roulette Wheel Container -->
        <div class="relative flex items-center justify-center my-2">
            <!-- Pointer Arrow at Top -->
            <div class="absolute -top-4 z-20 w-8 h-10 bg-gradient-to-b from-yellow-400 to-amber-600 clip-path-pointer shadow-lg transform -rotate-180 flex items-center justify-center">
                <div class="w-3 h-3 bg-white rounded-full shadow-inner mt-2"></div>
            </div>
            
            <!-- Canvas Wheel -->
            <div class="relative p-3 rounded-full card-glass shadow-2xl ring-4 ring-purple-500/30">
                <canvas id="wheelCanvas" width="320" height="320" class="w-72 h-72 sm:w-80 sm:h-80 rounded-full cursor-pointer transition-transform"></canvas>
                <!-- Center Spin Button Overlay -->
                <button id="centerSpinBtn" onclick="startSpin()" class="absolute inset-0 m-auto w-20 h-20 bg-gradient-to-tr from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-black rounded-full shadow-xl border-4 border-white/80 flex flex-col items-center justify-center transition-transform transform hover:scale-105 active:scale-95 z-10">
                    <span class="text-xs uppercase tracking-wider text-pink-200">Start</span>
                    <span class="text-sm font-bold">轉吧！</span>
                </button>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div id="controls-area" class="w-full mt-6 grid grid-cols-2 gap-3 px-2">
            <button id="spinBtn" onclick="startSpin()" class="py-3 px-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-bold rounded-xl shadow-lg shadow-purple-900/40 transition transform active:scale-95 flex items-center justify-center space-x-2">
                <span>🎲</span>
                <span>轉動轉盤</span>
            </button>
            <button id="dislikeBtn" onclick="handleDislike()" disabled class="py-3 px-4 bg-gray-700/50 text-gray-400 font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2 cursor-not-allowed">
                <span>🙄</span>
                <span>不滿意，再抽</span>
            </button>
        </div>

    </main>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="card-glass w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl transform scale-95 transition-transform duration-300 border border-purple-500/30" id="modalCard">
            <div id="modalEmoji" class="text-6xl mb-3 animate-bounce">✨</div>
            <h3 class="text-xs uppercase tracking-widest text-purple-300 font-bold mb-1">命運抽中</h3>
            <h2 id="modalFoodName" class="text-2xl font-black text-white mb-2">美食名稱</h2>
            <p id="modalFoodDesc" class="text-sm text-gray-300 mb-6 bg-purple-950/40 p-3 rounded-xl border border-purple-500/20">美食描述...</p>
            
            <div id="modalActionButtons" class="flex flex-col space-y-2">
                <button onclick="acceptFood()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-bold rounded-xl shadow-lg transition">
                    😋 就是它了！立刻出發！
                </button>
                <button onclick="rejectFood()" class="w-full py-3 bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-bold rounded-xl border border-gray-600 transition">
                    🙄 不滿意，重抽！
                </button>
            </div>
        </div>
    </div>

    <!-- McDonald's Forced Modal -->
    <div id="mcdonaldsModal" class="fixed inset-0 bg-red-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="bg-gradient-to-b from-amber-500 to-red-600 text-black w-full max-w-md rounded-3xl p-6 text-center shadow-2xl transform scale-95 transition-transform duration-500 border-4 border-yellow-300">
            <div class="text-6xl mb-2">🍟🍔</div>
            <div class="inline-block px-3 py-1 bg-yellow-300 text-red-900 rounded-full font-black text-xs mb-2 tracking-widest uppercase shadow">
                ⚠️ 三次機會用盡 ⚠️
            </div>
            <h2 class="text-3xl font-black text-white drop-shadow-md mb-2">命運的指引就是：<br>麥當勞！</h2>
            <p class="text-yellow-100 text-sm mb-6 font-medium bg-black/20 p-3 rounded-2xl">
                既然你連續拒絕了 3 次逢甲美食，宇宙顯然在暗示你：別挑了，金黃酥脆的薯條與大麥克才是你的最終歸宿！
            </p>
            
            <div class="flex flex-col space-y-3">
                <a href="https://maps.google.com/?q=麥當勞逢甲餐廳" target="_blank" class="w-full py-3.5 bg-yellow-300 hover:bg-yellow-400 text-red-900 font-black rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center justify-center space-x-2 text-lg">
                    <span>📍</span>
                    <span>開啟逢甲麥當勞導航</span>
                </a>
                <button onclick="resetEverything()" class="w-full py-2.5 bg-black/30 hover:bg-black/40 text-white font-bold rounded-xl transition text-sm">
                    🔄 不服氣，再玩一次轉盤
                </button>
            </div>
        </div>
    </div>

    <footer class="mt-6 text-center text-xs text-gray-400 z-10">
        <p>✨ 逢甲夜市周邊美食地圖精選 • 祝你有個美好的晚餐時光！</p>
    </footer>

    <script>
        // Food items array with details
        const foods = [
            { name: "官芝霖大腸包小腸", desc: "炭烤糯米腸夾香腸，經典逢甲必吃！", emoji: "🌭", color: "#f43f5e" },
            { name: "明倫蛋餅", desc: "獨特酥脆餅皮加秘製醬汁，排隊傳奇！", emoji: "🍳", color: "#fb923c" },
            { name: "日船章魚小丸子", desc: "外酥內軟、柴魚片在跳舞的美味章魚燒！", emoji: "🐙", color: "#fbbf24" },
            { name: "逢甲炒餅條", desc: "獨家蔥油餅條大火快炒，香氣四溢！", emoji: "🥢", color: "#34d399" },
            { name: "激旨燒鳥 Gekiuma", desc: "平價美味串燒，搭配日式氛圍極享受！", emoji: "🍢", color: "#38bdf8" },
            { name: "溫叨古早味料理", desc: "在地超人氣台菜合菜，溫暖又道地！", emoji: "🍲", color: "#818cf8" },
            { name: "皇廚帕泰 Pad Thai", desc: "酸甜濃郁的泰式炒河粉，異國風味首選！", emoji: "🍜", color: "#c084fc" },
            { name: "逢甲地瓜球", desc: "外皮酥脆內Q彈，排隊一口接一口！", emoji: "🍠", color: "#f472b6" }
        ];

        let strikeCount = 0;
        let isSpinning = false;
        let currentAngle = 0;
        let targetFood = null;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = foods.length;
        const arcSize = (2 * Math.PI) / numSlices;

        // Draw the wheel
        function drawWheel(angleOffset = 0) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = angleOffset + i * arcSize;
                const endAngle = startAngle + arcSize;

                // Draw slice background
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = foods[i].color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw text and emoji
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px "Noto Sans TC", sans-serif';
                
                // Truncate long names for wheel display
                let displayName = foods[i].name;
                if (displayName.length > 6) {
                    displayName = displayName.substring(0, 5) + '…';
                }
                
                ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                ctx.shadowBlur = 4;
                ctx.fillText(displayName, radius - 25, 5);
                
                // Draw emoji
                ctx.font = '16px sans-serif';
                ctx.fillText(foods[i].emoji, radius - 60, 5);
                
                ctx.restore();
            }

            // Draw outer border ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Initialize wheel drawing on load
        window.onload = function() {
            drawWheel(currentAngle);
        };

        // Start spinning animation
        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            // Disable buttons during spin
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('centerSpinBtn').disabled = true;

            // Random target index (ensure at least 5 full rotations + random slice)
            const winningIndex = Math.floor(Math.random() * numSlices);
            targetFood = foods[winningIndex];

            // Calculate target angle so the winning item points to the top pointer (0 radians or -Math.PI/2)
            // Slices are drawn clockwise starting from angleOffset
            const extraRotations = 5 * 2 * Math.PI;
            // The slice center angle relative to start
            const sliceAngle = winningIndex * arcSize + arcSize / 2;
            // We want sliceAngle + finalAngleOffset = 3*Math.PI/2 (top position)
            const targetFinalAngle = extraRotations + (1.5 * Math.PI - sliceAngle);

            const startAngle = currentAngle;
            const distance = targetFinalAngle - (startAngle % (2 * Math.PI));
            const totalDistance = distance + Math.ceil(extraRotations / (2 * Math.PI)) * 2 * Math.PI;
            
            const startTime = performance.now();
            const duration = 3500; // 3.5 seconds spin time

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out cubic deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = startAngle + totalDistance * easeOut;
                drawWheel(currentAngle);

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    currentAngle = currentAngle % (2 * Math.PI);
                    
                    // Re-enable buttons
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('centerSpinBtn').disabled = false;

                    // Show Result Modal
                    showResultModal(targetFood);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        // Show result popup
        function showResultModal(food) {
            document.getElementById('modalEmoji').innerText = food.emoji;
            document.getElementById('modalFoodName').innerText = food.name;
            document.getElementById('modalFoodDesc').innerText = food.desc;
            
            const modal = document.getElementById('resultModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div#modalCard').classList.remove('scale-95');
            modal.querySelector('div#modalCard').classList.add('scale-100');
        }

        // Accept chosen food
        function acceptFood() {
            closeResultModal();
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
            // Show success alert or banner
            alertMessage(`太棒了！今晚就決定去吃「${targetFood.name}」！祝你用餐愉快！`);
        }

        // Reject food (Increment strike count)
        function rejectFood() {
            closeResultModal();
            strikeCount++;
            document.getElementById('strike-count').innerText = strikeCount;

            // Enable dislike button
            const dislikeBtn = document.getElementById('dislikeBtn');
            dislikeBtn.disabled = false;
            dislikeBtn.classList.remove('bg-gray-700/50', 'text-gray-400', 'cursor-not-allowed');
            dislikeBtn.classList.add('bg-pink-600/80', 'hover:bg-pink-500', 'text-white', 'shadow-lg');

            if (strikeCount >= 3) {
                triggerMcDonaldsModal();
            } else {
                // Quick notification of remaining chances
                alertMessage(`已記錄！你還有 ${3 - strikeCount} 次拒絕機會，超過 3 次將強制前往麥當勞！`);
            }
        }

        // Handle dislike button click directly
        function handleDislike() {
            if (strikeCount < 3) {
                startSpin();
            } else {
                triggerMcDonaldsModal();
            }
        }

        // Close Result Modal helper
        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div#modalCard').classList.remove('scale-100');
            modal.querySelector('div#modalCard').classList.add('scale-95');
        }

        // Trigger McDonald's forced redirection modal
        function triggerMcDonaldsModal() {
            const mcdModal = document.getElementById('mcdonaldsModal');
            mcdModal.classList.remove('opacity-0', 'pointer-events-none');
            mcdModal.querySelector('div').classList.remove('scale-95');
            mcdModal.querySelector('div').classList.add('scale-100');

            // Festive confetti explosion for McDonald's
            confetti({
                particleCount: 200,
                spread: 120,
                origin: { y: 0.5 },
                colors: ['#facc15', '#ef4444', '#ffffff']
            });
        }

        // Reset everything
        function resetEverything() {
            strikeCount = 0;
            document.getElementById('strike-count').innerText = '0';
            
            const mcdModal = document.getElementById('mcdonaldsModal');
            mcdModal.classList.add('opacity-0', 'pointer-events-none');
            
            const dislikeBtn = document.getElementById('dislikeBtn');
            dislikeBtn.disabled = true;
            dislikeBtn.classList.add('bg-gray-700/50', 'text-gray-400', 'cursor-not-allowed');
            dislikeBtn.classList.remove('bg-pink-600/80', 'hover:bg-pink-500', 'text-white', 'shadow-lg');

            startSpin();
        }

        // Safe custom non-alert message box alternative
        function alertMessage(msg) {
            // Create temporary toast notification
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900/95 text-white px-6 py-3 rounded-2xl shadow-2xl border border-pink-500/40 z-50 text-sm font-bold flex items-center space-x-2 animate-bounce';
            toast.innerHTML = `<span>✨</span><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
